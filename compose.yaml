name: kitt

services:
  browser:
    image: "${KITT_BROWSER_IMAGE:-ghcr.io/rfdetoni/kitt-reverse-proxy-browser}:${KITT_REVERSE_PROXY_VERSION:-latest}"
    build:
      context: "https://github.com/rfdetoni/kitt-reverse-proxy.git#${KITT_REVERSE_PROXY_REF:-main}"
      dockerfile: docker/browser.Dockerfile
    environment:
      KITT_BROWSER_MODE: "${KITT_BROWSER_MODE:-headless}"
      KITT_BROWSER_PROFILE: /data/browser
    volumes:
      - kitt-browser-profile:/data/browser
    shm_size: "1gb"
    ports:
      - "127.0.0.1:${KITT_BROWSER_UI_PORT:-6080}:6080"
    restart: unless-stopped

  reverse-proxy:
    image: "${KITT_REVERSE_PROXY_IMAGE:-ghcr.io/rfdetoni/kitt-reverse-proxy}:${KITT_REVERSE_PROXY_VERSION:-latest}"
    build:
      context: "https://github.com/rfdetoni/kitt-reverse-proxy.git#${KITT_REVERSE_PROXY_REF:-main}"
      target: runtime
    environment:
      PROXY_API_KEY: "${KITT_PROXY_API_KEY:?Set KITT_PROXY_API_KEY in .env before starting K.I.T.T.}"
      CDP_URL: http://browser:9222
    command:
      - start
      - "${KITT_PROXY_PROVIDER:-chatgpt}"
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --user-data-dir
      - /data/browser
    ports:
      - "127.0.0.1:${KITT_PROXY_PORT:-3000}:3000"
    depends_on:
      browser:
        condition: service_healthy
    restart: unless-stopped

  sandbox-broker:
    profiles: ["agent"]
    image: "${KITT_AGENT_IMAGE:-ghcr.io/rfdetoni/kitt-agent-cli}:${KITT_AGENT_VERSION:-latest}"
    build:
      context: "https://github.com/rfdetoni/kitt-agent-cli.git#${KITT_AGENT_REF:-main}"
    user: "0:0"
    network_mode: "none"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["python", "-m", "kitt.security.autopilot_broker"]
    command: ["serve"]
    environment:
      KITT_SANDBOX_BROKER_SOCKET: /run/kitt-broker/exec.sock
      KITT_BROKER_DEFAULT_IMAGE: "${KITT_AGENT_IMAGE:-ghcr.io/rfdetoni/kitt-agent-cli}:${KITT_AGENT_VERSION:-latest}"
      KITT_BROKER_ALLOW_NETWORK: "${KITT_BROKER_ALLOW_NETWORK:-false}"
    volumes:
      - "${KITT_WORKSPACE:-.}:/workspace"
      - /var/run/docker.sock:/var/run/docker.sock
      - kitt-sandbox-socket:/run/kitt-broker
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-m", "kitt.security.autopilot_broker", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  agent:
    profiles: ["agent"]
    image: "${KITT_AGENT_IMAGE:-ghcr.io/rfdetoni/kitt-agent-cli}:${KITT_AGENT_VERSION:-latest}"
    build:
      context: "https://github.com/rfdetoni/kitt-agent-cli.git#${KITT_AGENT_REF:-main}"
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      KITT_SANDBOX_BROKER_SOCKET: /run/kitt-broker/exec.sock
      KITT_AUTOPILOT_DELEGATE_NETWORK: "${KITT_AUTOPILOT_DELEGATE_NETWORK:-false}"
      KITT_AUTOPILOT_VALIDATION: "${KITT_AUTOPILOT_VALIDATION:-}"
    volumes:
      - "${KITT_WORKSPACE:-.}:/workspace"
      - kitt-agent-state:/home/kitt/.kitt
      - kitt-sandbox-socket:/run/kitt-broker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      reverse-proxy:
        condition: service_started
      sandbox-broker:
        condition: service_healthy

volumes:
  kitt-sandbox-socket:
  kitt-agent-state:
  kitt-browser-profile:
