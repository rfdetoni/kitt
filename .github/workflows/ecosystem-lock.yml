name: ecosystem-lock

on:
  push:
    branches: [main]
    paths:
      - ecosystem.json
      - ecosystem.lock.json
      - installer/catalog.py
      - scripts/validate_ecosystem_lock.py
      - scripts/validate_component_pins.py
      - .github/workflows/ecosystem-lock.yml
  pull_request:
    paths:
      - ecosystem.json
      - ecosystem.lock.json
      - installer/catalog.py
      - scripts/validate_ecosystem_lock.py
      - .github/workflows/ecosystem-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate catalog, immutable lock and Agent closure
        run: python scripts/validate_ecosystem_lock.py
      - name: Verify every pinned commit exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          components = json.load(open("ecosystem.lock.json", encoding="utf-8"))["components"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "kitt-ecosystem-lock",
          }
          for repo, sha in components.items():
              url = f"https://api.github.com/repos/{repo}/commits/{sha}"
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=20
              ) as response:
                  if response.status != 200:
                      raise SystemExit(f"{repo}@{sha}: HTTP {response.status}")
              print(f"{repo}@{sha}: ok")
          PY
      - name: Validate cross-repository dependency pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validate_component_pins.py
