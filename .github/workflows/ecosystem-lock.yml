name: ecosystem-lock

on:
  push:
    branches: [main]
    paths:
      - ecosystem.lock.json
      - scripts/validate_ecosystem_lock.py
      - .github/workflows/ecosystem-lock.yml
  pull_request:
    paths:
      - ecosystem.lock.json
      - scripts/validate_ecosystem_lock.py
      - .github/workflows/ecosystem-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate immutable ecosystem lock
        run: python scripts/validate_ecosystem_lock.py
      - name: Verify every pinned commit exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          components = json.load(open("ecosystem.lock.json", encoding="utf-8"))["components"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "kitt-ecosystem-lock",
          }
          for repo, sha in components.items():
              url = f"https://api.github.com/repos/{repo}/commits/{sha}"
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers), timeout=20
              ) as response:
                  if response.status != 200:
                      raise SystemExit(f"{repo}@{sha}: HTTP {response.status}")
              print(f"{repo}@{sha}: ok")
          PY
