name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate immutable ecosystem release manifest
        run: python scripts/validate_ecosystem_main.py --release
      - name: Verify release component SHAs exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_ecosystem_main.py --release | while read -r component repository sha; do
            echo "verify $component $repository@$sha"
            gh api "repos/$repository/commits/$sha" --silent
          done
      - name: Verify release tag matches ecosystem version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match VERSION $expected" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict semantic version vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
      - name: Build multi-platform installer artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          pkg_dir="$stage/kitt-installer-${RELEASE_TAG}"
          mkdir -p "$pkg_dir"
          cp -R installer VERSION ecosystem.json ecosystem.release.json install.sh install.ps1 "$pkg_dir/"
          tar -czf "dist-release/kitt-installer-${RELEASE_TAG}-linux.tar.gz" -C "$stage" "kitt-installer-${RELEASE_TAG}"
          tar -czf "dist-release/kitt-installer-${RELEASE_TAG}-macos.tar.gz" -C "$stage" "kitt-installer-${RELEASE_TAG}"
          python - "$stage" "dist-release/kitt-installer-${RELEASE_TAG}-windows.zip" <<'PYZIP'
          import sys, zipfile
          from pathlib import Path
          src = Path(sys.argv[1])
          out = Path(sys.argv[2])
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(src.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(src).as_posix())
          PYZIP
          cp ecosystem.release.json dist-release/ecosystem.release.json
          (cd dist-release && sha256sum ecosystem.release.json "kitt-installer-${RELEASE_TAG}-linux.tar.gz" "kitt-installer-${RELEASE_TAG}-macos.tar.gz" "kitt-installer-${RELEASE_TAG}-windows.zip" > SHA256SUMS.txt)
          (cd dist-release && sha256sum -c SHA256SUMS.txt)

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist-release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              dist-release/*
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "$RELEASE_TAG" \
              dist-release/*
          else
            echo "Expected release tag $RELEASE_TAG was not found." >&2
            exit 1
          fi
