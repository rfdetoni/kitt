name: ecosystem-main

on:
  pull_request:
    paths:
      - ecosystem.json
      - ecosystem.release.json
      - VERSION
      - installer/catalog.py
      - installer/release_manifest.py
      - installer/cli.py
      - scripts/validate_ecosystem_main.py
      - scripts/validate_architecture.py
      - tests/test_ecosystem_architecture.py
      - tests/test_ecosystem_release_pins.py
      - tests/test_installer.py
      - tests/test_installer_update.py
      - .github/workflows/ecosystem-main.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate edge and release component policy
        run: python scripts/validate_ecosystem_main.py
      - name: Require release component pins to match current mains
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validate_ecosystem_main.py --check-main-heads
      - name: Validate bounded-context architecture
        run: python scripts/validate_architecture.py
      - name: Smoke synthetic retrieval benchmark harness
        run: python benchmarks/retrieval_sqlite_lsh.py --rows 200 --dimensions 8 --queries 2
      - name: Run installer/catalog regressions
        run: python -m unittest tests.test_installer tests.test_installer_update tests.test_ecosystem_architecture tests.test_ecosystem_release_pins -v
