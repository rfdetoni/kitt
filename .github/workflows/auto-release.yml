name: Automatic Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve published release baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          current="$(tr -d '[:space:]' < VERSION)"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest published release is not strict semver: $latest_tag" >&2
            exit 1
          fi
          latest="${latest_tag#v}"
          relation="$(python - "$current" "$latest" <<'PY'
          import re, sys
          pattern = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          def parse(raw):
              match = pattern.fullmatch(raw)
              if not match:
                  raise SystemExit(f"invalid semantic version: {raw}")
              return tuple(map(int, match.groups()))
          current, latest = parse(sys.argv[1]), parse(sys.argv[2])
          print("behind" if current < latest else "ahead" if current > latest else "equal")
          PY
          )"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "relation=$relation" >> "$GITHUB_OUTPUT"

      - name: Reconcile main with latest published release
        if: steps.baseline.outputs.relation == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.baseline.outputs.latest }}
          RELEASE_TAG: ${{ steps.baseline.outputs.latest_tag }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_VERSION" > VERSION
          branch="automation/reconcile-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add VERSION
          git commit -m "chore(version): align main with ${RELEASE_TAG}"
          git push --force origin "HEAD:refs/heads/$branch"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --base main --head "$branch" --title "chore(version): align main with ${RELEASE_TAG}" --body "Reconciles VERSION with the latest published release ${RELEASE_TAG}." >/dev/null
            pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr" --squash --delete-branch
          gh workflow run auto-release.yml --ref main

      - name: Publish version already committed to main
        if: steps.baseline.outputs.relation == 'ahead'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.baseline.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${CURRENT_VERSION}"
          head="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged="$(git rev-list -n1 "$tag")"
            if [[ "$tagged" != "$head" ]]; then
              if ! git merge-base --is-ancestor "$tagged" "$head"; then
                echo "Tag $tag exists at unrelated commit $tagged; refusing ambiguous release." >&2
                exit 1
              fi
              candidate="$(python - "$CURRENT_VERSION" <<'PY'
          import sys
          major, minor, patch = map(int, sys.argv[1].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
              )"
              while git rev-parse -q --verify "refs/tags/v${candidate}" >/dev/null; do
                candidate="$(python - "$candidate" <<'PY'
          import sys
          major, minor, patch = map(int, sys.argv[1].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
                )"
              done
              printf '%s\n' "$candidate" > VERSION
              branch="automation/recover-v${candidate}"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout -B "$branch"
              git add VERSION
              git commit -m "chore(release): v${candidate}"
              git push --force origin "HEAD:refs/heads/$branch"
              pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
              if [[ -z "$pr" ]]; then
                gh pr create --base main --head "$branch" --title "chore(release): v${candidate}" --body "Advances VERSION past immutable tag $tag, which points to an older ancestor." >/dev/null
                pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
              fi
              gh pr merge "$pr" --squash --delete-branch
              gh workflow run auto-release.yml --ref main
              exit 0
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$head"
            git push origin "refs/tags/$tag"
          fi
          gh workflow run release.yml --ref "$tag" -f tag="$tag"

      - name: Calculate next semantic version
        id: version
        if: steps.baseline.outputs.relation == 'equal'
        env:
          CURRENT_VERSION: ${{ steps.baseline.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          next="$(python .github/scripts/next_semver.py "$CURRENT_VERSION")"
          if [[ -z "$next" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the latest semantic tag."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Create and merge release version PR
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEXT_VERSION" > VERSION
          branch="automation/release-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add VERSION
          git commit -m "chore(release): ${RELEASE_TAG}"
          git push --force origin "HEAD:refs/heads/$branch"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --base main --head "$branch" --title "chore(release): ${RELEASE_TAG}" --body "Commits VERSION for ${RELEASE_TAG} to main before publication." >/dev/null
            pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "$pr" --squash --delete-branch
          gh workflow run auto-release.yml --ref main
