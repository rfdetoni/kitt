name: ecosystem-integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n install.sh
      - shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))

  main-install:
    name: Install main ecosystem end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KITT_INSTALL_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.90.0"
      - name: Set installer Rust toolchain default
        run: rustup default 1.90.0
      - name: Install Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Validate catalog and architecture
        run: |
          python scripts/validate_ecosystem_main.py
          python scripts/validate_architecture.py
      - name: Perform clean main installation
        shell: bash
        run: |
          set -euo pipefail
          original_home="$HOME"
          export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
          export HOME="$RUNNER_TEMP/kitt-home"
          mkdir -p "$HOME"
          python -m installer             --preset agent             --yes             --root "$RUNNER_TEMP/kitt-runtime"             --bin-dir "$RUNNER_TEMP/kitt-bin"             --no-start-services             --verbose
      - name: Verify installed runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/kitt-runtime"
          bindir="$RUNNER_TEMP/kitt-bin"
          "$runtime/.venv-agent/bin/python" -m pip check
          "$bindir/kitt" --help >/dev/null
          "$bindir/kitt-reverse-proxy" --help >/dev/null
          set +e
          kittctl_usage="$("$bindir/kittctl" 2>&1)"
          kittctl_rc=$?
          set -e
          test "$kittctl_rc" -eq 2
          grep -q '^usage: kittctl ' <<<"$kittctl_usage"
          test ! -d "$runtime/.staging/sources"
          RUNTIME="$runtime" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNTIME"])
          installed = json.loads((root / "installed-state.json").read_text(encoding="utf-8"))
          assert installed["source_ref"] == "main", installed
          assert installed["repositories"], installed
          assert all(len(sha) == 40 for sha in installed["repositories"].values())
          expected = {"protocol", "memory", "toolbox", "assistant", "agent-cli", "ai-workers", "reverse-proxy"}
          assert set(installed["resolved_modules"]) == expected, installed["resolved_modules"]
          print("main end-to-end installation: ok")
          PY

  ecosystem:
    if: always()
    needs: [installers, main-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require release gates
        shell: bash
        run: |
          test "${{ needs.installers.result }}" = success
          test "${{ needs.main-install.result }}" = success
