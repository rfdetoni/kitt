name: ecosystem-integration

on:
  workflow_dispatch:
    inputs:
      protocol_ref:
        description: kitt-protocol ref
        required: false
        default: main
      memory_ref:
        description: kitt-memory ref
        required: false
        default: main
      toolbox_ref:
        description: kitt-toolbox ref
        required: false
        default: main
      workers_ref:
        description: kitt-ai-workers ref
        required: false
        default: main
      assistant_ref:
        description: kitt-assistant ref
        required: false
        default: main
      agent_ref:
        description: kitt-agent-cli ref
        required: false
        default: main
      reverse_proxy_ref:
        description: kitt-reverse-proxy ref
        required: false
        default: main
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL_REF: ${{ github.event.inputs.protocol_ref || 'main' }}
  MEMORY_REF: ${{ github.event.inputs.memory_ref || 'main' }}
  TOOLBOX_REF: ${{ github.event.inputs.toolbox_ref || 'main' }}
  WORKERS_REF: ${{ github.event.inputs.workers_ref || 'main' }}
  ASSISTANT_REF: ${{ github.event.inputs.assistant_ref || 'main' }}
  AGENT_REF: ${{ github.event.inputs.agent_ref || 'main' }}
  REVERSE_PROXY_REF: ${{ github.event.inputs.reverse_proxy_ref || 'main' }}

jobs:
  resolve_refs:
    name: Freeze ecosystem snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol_sha: ${{ steps.refs.outputs.protocol_sha }}
      memory_sha: ${{ steps.refs.outputs.memory_sha }}
      toolbox_sha: ${{ steps.refs.outputs.toolbox_sha }}
      workers_sha: ${{ steps.refs.outputs.workers_sha }}
      assistant_sha: ${{ steps.refs.outputs.assistant_sha }}
      agent_sha: ${{ steps.refs.outputs.agent_sha }}
      reverse_proxy_sha: ${{ steps.refs.outputs.reverse_proxy_sha }}
    steps:
      - name: Resolve refs to immutable SHAs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          refs = {
              'protocol_sha': ('rfdetoni/kitt-protocol', os.environ['PROTOCOL_REF']),
              'memory_sha': ('rfdetoni/kitt-memory', os.environ['MEMORY_REF']),
              'toolbox_sha': ('rfdetoni/kitt-toolbox', os.environ['TOOLBOX_REF']),
              'workers_sha': ('rfdetoni/kitt-ai-workers', os.environ['WORKERS_REF']),
              'assistant_sha': ('rfdetoni/kitt-assistant', os.environ['ASSISTANT_REF']),
              'agent_sha': ('rfdetoni/kitt-agent-cli', os.environ['AGENT_REF']),
              'reverse_proxy_sha': ('rfdetoni/kitt-reverse-proxy', os.environ['REVERSE_PROXY_REF']),
          }
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'kitt-ecosystem-integration',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for key, (repo, ref) in refs.items():
                  url = f"https://api.github.com/repos/{repo}/commits/{urllib.parse.quote(ref, safe='')}"
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                      sha = str(json.load(response).get('sha', ''))
                  if not re.fullmatch(r'[0-9a-f]{40}', sha):
                      raise SystemExit(f'invalid SHA for {repo} ref {ref!r}: {sha!r}')
                  out.write(f'{key}={sha}\n')
                  print(f'{repo}: {sha}')
          PY

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash -n install.sh
      - shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))

  protocol:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: PYTHONPATH=sdk/python python -m unittest discover sdk/python/tests
      - run: npm ci
      - run: npm test

  memory:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-memory
          ref: ${{ needs.resolve_refs.outputs.memory_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  toolbox:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-toolbox
          ref: ${{ needs.resolve_refs.outputs.toolbox_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build native wheel
        shell: bash
        run: |
          python -m pip install 'maturin>=1.8,<2'
          python packaging/build_native_release.py --out dist-native
          python -m pip install --no-deps dist-native/*.whl
          python -c "import kitt_native; print(kitt_native.ENGINE_VERSION)"

  workers:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-ai-workers
          ref: ${{ needs.resolve_refs.outputs.workers_sha }}
          path: workers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          path: agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./agent[dev] -e ./workers -e ./workers/packages/kitt-evolution -e ./workers/packages/kitt-evals
      - working-directory: workers
        run: python -m unittest discover tests
      - working-directory: workers
        run: python -m unittest discover packages/kitt-evolution/tests
      - working-directory: workers
        run: python -m unittest discover packages/kitt-evals/tests
      - name: Verify extracted ownership
        run: python -c "from pathlib import Path; import kitt.evolution, kitt.evals.corpus; mods=(kitt.evolution,kitt.evals.corpus); assert all('workers' in str(Path(m.__file__).resolve()) for m in mods)"

  assistant:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ needs.resolve_refs.outputs.assistant_sha }}
          path: assistant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          path: agent
          persist-credentials: false
      - name: Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: assistant
        run: cargo fmt --all --check
      - working-directory: assistant
        run: cargo clippy --workspace --all-targets -- -D warnings
      - working-directory: assistant
        run: cargo test --workspace
      - run: python -m pip install -e ./agent[dev] -e ./assistant/packages/kitt-assistant-runtime
      - name: Verify runtime ownership
        run: python -c "from pathlib import Path; import kitt.daemon.client, kitt.remote.server; mods=(kitt.daemon.client,kitt.remote.server); assert all('kitt-assistant-runtime' in str(Path(m.__file__).resolve()) for m in mods)"
      - run: python -m unittest discover -s assistant/packages/kitt-assistant-runtime/tests -v
      - working-directory: assistant
        run: node --test tests/control_center_r3.test.mjs

  agent_cli:
    needs: resolve_refs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          path: agent
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ needs.resolve_refs.outputs.assistant_sha }}
          path: assistant
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-ai-workers
          ref: ${{ needs.resolve_refs.outputs.workers_sha }}
          path: workers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./agent[dev] -e ./assistant/packages/kitt-assistant-runtime -e ./workers/packages/kitt-evolution -e ./workers/packages/kitt-evals
      - working-directory: agent
        run: python -m unittest discover -s tests -v
      - working-directory: agent
        run: python -m unittest discover -s tests/prime_architecture -v
      - name: Verify composed namespace
        run: python -c "import kitt.core.runtime, kitt.daemon.client, kitt.remote.server, kitt.evolution, kitt.evals.corpus; print('frozen composed namespace: ok')"

  reverse_proxy:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rfdetoni/kitt-reverse-proxy
          ref: ${{ needs.resolve_refs.outputs.reverse_proxy_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify

  ecosystem:
    if: always()
    needs: [resolve_refs, installers, protocol, memory, toolbox, workers, assistant, agent_cli, reverse_proxy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every frozen-snapshot gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.resolve_refs.result }}' = success
          test '${{ needs.installers.result }}' = success
          test '${{ needs.protocol.result }}' = success
          test '${{ needs.memory.result }}' = success
          test '${{ needs.toolbox.result }}' = success
          test '${{ needs.workers.result }}' = success
          test '${{ needs.assistant.result }}' = success
          test '${{ needs.agent_cli.result }}' = success
          test '${{ needs.reverse_proxy.result }}' = success
