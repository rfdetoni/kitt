name: ecosystem-integration

on:
  workflow_dispatch:
    inputs:
      protocol_ref:
        description: kitt-protocol ref (branch, tag or SHA)
        required: false
        default: main
      memory_ref:
        description: kitt-memory ref
        required: false
        default: main
      toolbox_ref:
        description: kitt-toolbox ref
        required: false
        default: main
      workers_ref:
        description: kitt-ai-workers ref
        required: false
        default: main
      assistant_ref:
        description: kitt-assistant ref
        required: false
        default: main
      agent_ref:
        description: kitt-agent-cli ref
        required: false
        default: main
      reverse_proxy_ref:
        description: kitt-reverse-proxy ref
        required: false
        default: main
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL_REF: ${{ github.event.inputs.protocol_ref || 'main' }}
  MEMORY_REF: ${{ github.event.inputs.memory_ref || 'main' }}
  TOOLBOX_REF: ${{ github.event.inputs.toolbox_ref || 'main' }}
  WORKERS_REF: ${{ github.event.inputs.workers_ref || 'main' }}
  ASSISTANT_REF: ${{ github.event.inputs.assistant_ref || 'main' }}
  AGENT_REF: ${{ github.event.inputs.agent_ref || 'main' }}
  REVERSE_PROXY_REF: ${{ github.event.inputs.reverse_proxy_ref || 'main' }}

jobs:
  resolve_refs:
    name: Freeze ecosystem snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol_sha: ${{ steps.refs.outputs.protocol_sha }}
      memory_sha: ${{ steps.refs.outputs.memory_sha }}
      toolbox_sha: ${{ steps.refs.outputs.toolbox_sha }}
      workers_sha: ${{ steps.refs.outputs.workers_sha }}
      assistant_sha: ${{ steps.refs.outputs.assistant_sha }}
      agent_sha: ${{ steps.refs.outputs.agent_sha }}
      reverse_proxy_sha: ${{ steps.refs.outputs.reverse_proxy_sha }}
    steps:
      - name: Resolve requested refs to immutable commit SHAs
        id: refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          components = {
              "protocol_sha": ("rfdetoni/kitt-protocol", os.environ["PROTOCOL_REF"]),
              "memory_sha": ("rfdetoni/kitt-memory", os.environ["MEMORY_REF"]),
              "toolbox_sha": ("rfdetoni/kitt-toolbox", os.environ["TOOLBOX_REF"]),
              "workers_sha": ("rfdetoni/kitt-ai-workers", os.environ["WORKERS_REF"]),
              "assistant_sha": ("rfdetoni/kitt-assistant", os.environ["ASSISTANT_REF"]),
              "agent_sha": ("rfdetoni/kitt-agent-cli", os.environ["AGENT_REF"]),
              "reverse_proxy_sha": ("rfdetoni/kitt-reverse-proxy", os.environ["REVERSE_PROXY_REF"]),
          }
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "kitt-ecosystem-integration",
          }
          resolved = {}
          for key, (repo, requested_ref) in components.items():
              encoded_ref = urllib.parse.quote(requested_ref, safe="")
              url = f"https://api.github.com/repos/{repo}/commits/{encoded_ref}"
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read(4096).decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"failed to resolve {repo} ref {requested_ref!r}: HTTP {exc.code} {detail}"
                  ) from exc
              sha = str(payload.get("sha", ""))
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(
                      f"GitHub returned an invalid commit SHA for {repo} ref {requested_ref!r}"
                  )
              resolved[key] = (repo, requested_ref, sha)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, (_, _, sha) in resolved.items():
                  output.write(f"{key}={sha}\n")

          def safe_cell(value: str) -> str:
              return value.replace("\n", " ").replace("\r", " ").replace("|", "\\|")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Frozen KITT ecosystem snapshot\n\n")
              summary.write("| Component | Requested ref | Resolved SHA |\n")
              summary.write("| --- | --- | --- |\n")
              for _, (repo, requested_ref, sha) in resolved.items():
                  summary.write(
                      f"| `{safe_cell(repo)}` | `{safe_cell(requested_ref)}` | `{sha}` |\n"
                  )
          PY

  protocol:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt, clippy }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: PYTHONPATH=sdk/python python -m unittest discover sdk/python/tests
      - run: npm ci
      - run: npm test

  memory:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-memory
          ref: ${{ needs.resolve_refs.outputs.memory_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt, clippy }
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  toolbox:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-toolbox
          ref: ${{ needs.resolve_refs.outputs.toolbox_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt, clippy }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  workers:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-ai-workers
          ref: ${{ needs.resolve_refs.outputs.workers_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13' }
      - run: python -m pip install -e .
      - run: python -m unittest discover tests

  assistant:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout assistant
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ needs.resolve_refs.outputs.assistant_sha }}
          path: kitt-assistant
          persist-credentials: false
      - name: Checkout protocol sibling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          path: kitt-protocol
          persist-credentials: false
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt, clippy }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kitt-assistant/apps/kitt-hud/package-lock.json
      - working-directory: kitt-assistant
        run: cargo fmt --all --check
      - working-directory: kitt-assistant
        run: cargo clippy --workspace --all-targets -- -D warnings
      - working-directory: kitt-assistant
        run: cargo test --workspace
      - working-directory: kitt-assistant
        run: node --test tests/control_center_r3.test.mjs
      - working-directory: kitt-assistant/apps/kitt-hud
        run: npm ci
      - working-directory: kitt-assistant/apps/kitt-hud
        run: npm run build

  agent_cli:
    needs: resolve_refs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.14' }
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests/prime_architecture -v

  reverse_proxy:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rfdetoni/kitt-reverse-proxy
          ref: ${{ needs.resolve_refs.outputs.reverse_proxy_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run verify

  ecosystem:
    if: always()
    needs: [resolve_refs, protocol, memory, toolbox, workers, assistant, agent_cli, reverse_proxy]
    runs-on: ubuntu-latest
    steps:
      - name: Require snapshot resolution and every component gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.resolve_refs.result }}" = success
          test "${{ needs.protocol.result }}" = success
          test "${{ needs.memory.result }}" = success
          test "${{ needs.toolbox.result }}" = success
          test "${{ needs.workers.result }}" = success
          test "${{ needs.assistant.result }}" = success
          test "${{ needs.agent_cli.result }}" = success
          test "${{ needs.reverse_proxy.result }}" = success
