name: ecosystem-integration

on:
  pull_request:
  workflow_dispatch:
    inputs:
      protocol_ref:
        description: kitt-protocol ref (branch, tag or SHA)
        required: false
        default: main
      memory_ref:
        description: kitt-memory ref
        required: false
        default: main
      toolbox_ref:
        description: kitt-toolbox ref
        required: false
        default: main
      workers_ref:
        description: kitt-ai-workers ref
        required: false
        default: main
      assistant_ref:
        description: kitt-assistant ref
        required: false
        default: main
      agent_ref:
        description: kitt-agent-cli ref
        required: false
        default: main
      reverse_proxy_ref:
        description: kitt-reverse-proxy ref
        required: false
        default: main
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL_REF: ${{ github.event.inputs.protocol_ref || 'main' }}
  MEMORY_REF: ${{ github.event.inputs.memory_ref || 'main' }}
  TOOLBOX_REF: ${{ github.event.inputs.toolbox_ref || 'main' }}
  WORKERS_REF: ${{ github.event.inputs.workers_ref || 'main' }}
  ASSISTANT_REF: ${{ github.event.inputs.assistant_ref || 'main' }}
  AGENT_REF: ${{ github.event.inputs.agent_ref || 'main' }}
  REVERSE_PROXY_REF: ${{ github.event.inputs.reverse_proxy_ref || 'main' }}

jobs:
  resolve_refs:
    name: Resolve ecosystem refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      protocol_sha: ${{ steps.refs.outputs.protocol_sha }}
      memory_sha: ${{ steps.refs.outputs.memory_sha }}
      toolbox_sha: ${{ steps.refs.outputs.toolbox_sha }}
      workers_sha: ${{ steps.refs.outputs.workers_sha }}
      assistant_sha: ${{ steps.refs.outputs.assistant_sha }}
      agent_sha: ${{ steps.refs.outputs.agent_sha }}
      reverse_proxy_sha: ${{ steps.refs.outputs.reverse_proxy_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve requested refs for this CI run
        id: refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          components = {
              "protocol_sha": ("rfdetoni/kitt-protocol", os.environ["PROTOCOL_REF"]),
              "memory_sha": ("rfdetoni/kitt-memory", os.environ["MEMORY_REF"]),
              "toolbox_sha": ("rfdetoni/kitt-toolbox", os.environ["TOOLBOX_REF"]),
              "workers_sha": ("rfdetoni/kitt-ai-workers", os.environ["WORKERS_REF"]),
              "assistant_sha": ("rfdetoni/kitt-assistant", os.environ["ASSISTANT_REF"]),
              "agent_sha": ("rfdetoni/kitt-agent-cli", os.environ["AGENT_REF"]),
              "reverse_proxy_sha": ("rfdetoni/kitt-reverse-proxy", os.environ["REVERSE_PROXY_REF"]),
          }
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "kitt-ecosystem-integration",
          }
          resolved = {}
          for key, (repo, requested_ref) in components.items():
              encoded_ref = urllib.parse.quote(requested_ref, safe="")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/commits/{encoded_ref}", headers=headers
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read(4096).decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"failed to resolve {repo} ref {requested_ref!r}: HTTP {exc.code} {detail}"
                  ) from exc
              sha = str(payload.get("sha", ""))
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"invalid SHA returned for {repo} ref {requested_ref!r}")
              resolved[key] = (repo, requested_ref, sha)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, (_, _, sha) in resolved.items():
                  output.write(f"{key}={sha}\n")

          def safe(value: str) -> str:
              return value.replace("\n", " ").replace("\r", " ").replace("|", "\\|")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## KITT ecosystem refs resolved for this CI run\n\n")
              summary.write("| Component | Requested ref | Resolved SHA |\n| --- | --- | --- |\n")
              for _, (repo, requested_ref, sha) in resolved.items():
                  summary.write(f"| `{safe(repo)}` | `{safe(requested_ref)}` | `{sha}` |\n")
          PY

  installers:
    name: Validate ecosystem installers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n install.sh
      - shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))

  protocol:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt,clippy }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22', cache: npm }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: PYTHONPATH=sdk/python python -m unittest discover sdk/python/tests
      - run: npm ci
      - run: npm test

  memory:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-memory
          ref: ${{ needs.resolve_refs.outputs.memory_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt,clippy }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  toolbox:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-toolbox
          ref: ${{ needs.resolve_refs.outputs.toolbox_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt,clippy }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Build shared native Python wheel
        run: |
          python -m pip install 'maturin>=1.8,<2'
          python packaging/build_native_release.py --out dist-native
          python -m pip install --no-deps dist-native/*.whl
          python -c "import kitt_native; print(kitt_native.ENGINE_VERSION)"

  workers:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-ai-workers
          ref: ${{ needs.resolve_refs.outputs.workers_sha }}
          path: kitt-ai-workers
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          path: kitt-agent-cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          path: kitt-protocol
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - name: Install composed split packages
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-deps -e ./kitt-protocol/sdk/python
          python -m pip install -e ./kitt-agent-cli
          python -m pip install --no-deps --force-reinstall -e ./kitt-protocol/sdk/python
          python -m pip install --no-deps -e ./kitt-ai-workers
          python -m pip install --no-deps -e ./kitt-ai-workers/packages/kitt-evolution
          python -m pip install --no-deps -e ./kitt-ai-workers/packages/kitt-evals
          python -m pip check
      - working-directory: kitt-ai-workers
        run: python -m unittest discover tests
      - working-directory: kitt-ai-workers
        run: python -m unittest discover packages/kitt-evolution/tests
      - working-directory: kitt-ai-workers
        run: python -m unittest discover packages/kitt-evals/tests
      - name: Verify Evolution/Evals ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import kitt.evolution
          import kitt.evals.corpus
          for module in (kitt.evolution, kitt.evals.corpus):
              path = Path(module.__file__).resolve()
              assert 'kitt-ai-workers' in str(path), path
          print('Evolution/Evals ownership: ok')
          PY

  assistant:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ needs.resolve_refs.outputs.assistant_sha }}
          path: kitt-assistant
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          path: kitt-agent-cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          path: kitt-protocol
          persist-credentials: false
      - name: Install Linux audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { components: rustfmt,clippy }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: kitt-assistant/apps/kitt-hud/package-lock.json
      - working-directory: kitt-assistant
        run: cargo fmt --all --check
      - working-directory: kitt-assistant
        run: cargo clippy --workspace --all-targets -- -D warnings
      - working-directory: kitt-assistant
        run: cargo test --workspace
      - name: Install composed Python runtime
        run: |
          python -m pip install pytest pytest-asyncio
          python -m pip install --no-deps ./kitt-protocol/sdk/python
          python -m pip install ./kitt-agent-cli
          python -m pip install --no-deps --force-reinstall ./kitt-protocol/sdk/python
          python -m pip install --no-deps ./kitt-assistant/packages/kitt-assistant-runtime
          python -m pip check
      - name: Verify Assistant runtime ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import kitt
          import kitt.daemon.client
          import kitt.daemon.server
          import kitt.remote.server
          assert hasattr(kitt, "KITT_VERSION"), kitt
          for module in (kitt.daemon.client, kitt.daemon.server, kitt.remote.server):
              path = Path(module.__file__).resolve()
              assert 'site-packages' in str(path), path
          print('Assistant runtime wheel composition: ok')
          PY
      - run: python -m unittest discover -s kitt-assistant/packages/kitt-assistant-runtime/tests -v
      - working-directory: kitt-assistant
        run: node --test tests/control_center_r3.test.mjs
      - working-directory: kitt-assistant/apps/kitt-hud
        run: npm ci
      - working-directory: kitt-assistant/apps/kitt-hud
        run: npm run build

  agent_cli:
    needs: resolve_refs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-agent-cli
          ref: ${{ needs.resolve_refs.outputs.agent_sha }}
          path: kitt-agent-cli
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-assistant
          ref: ${{ needs.resolve_refs.outputs.assistant_sha }}
          path: kitt-assistant
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-ai-workers
          ref: ${{ needs.resolve_refs.outputs.workers_sha }}
          path: kitt-ai-workers
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ needs.resolve_refs.outputs.protocol_sha }}
          path: kitt-protocol
          persist-credentials: false
      - name: Checkout memory authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-memory
          ref: ${{ needs.resolve_refs.outputs.memory_sha }}
          path: memory-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Build Agent memory authority
        shell: bash
        run: |
          cargo build --manifest-path memory-source/Cargo.toml --release --locked -p kitt-memoryd
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          echo "KITT_MEMORYD_BIN=$GITHUB_WORKSPACE/memory-source/target/release/kitt-memoryd$suffix" >> "$GITHUB_ENV"
          echo "KITT_MEMORY_CONFIG_DIR=$RUNNER_TEMP/kitt-memory-config" >> "$GITHUB_ENV"
          echo "KITT_MEMORY_DATA_DIR=$RUNNER_TEMP/kitt-memory-data" >> "$GITHUB_ENV"
          echo "KITT_MEMORY_TOKEN_PATH=$RUNNER_TEMP/kitt-memory-config/auth.token" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - name: Install composed namespace
        run: |
          python -m pip install pytest pytest-asyncio
          # Use regular installs here: multiple PEP 660 editable distributions
          # sharing the kitt.* namespace can register competing namespace finders.
          # This gate intentionally validates the same import composition users get.
          python -m pip install --no-deps ./kitt-protocol/sdk/python
          python -m pip install ./kitt-agent-cli
          python -m pip install --no-deps --force-reinstall ./kitt-protocol/sdk/python
          python -m pip install --no-deps ./kitt-assistant/packages/kitt-assistant-runtime
          python -m pip install --no-deps ./kitt-ai-workers/packages/kitt-evolution
          python -m pip install --no-deps ./kitt-ai-workers/packages/kitt-evals
          python -m pip check
      - name: Compile Agent and companions
        run: >-
          python -m compileall -q
          kitt-agent-cli/kitt
          kitt-assistant/packages/kitt-assistant-runtime/kitt
          kitt-ai-workers/packages/kitt-evolution/kitt
          kitt-ai-workers/packages/kitt-evals/kitt
      - working-directory: kitt-agent-cli
        run: python -m pytest -q
      - name: Verify planning contract composition
        run: |
          python - <<'PY'
          from kitt_protocol import AgentRole, HostExecutionState, KittRequestMetadata
          from kitt.core.task_plan import TaskPlanCoordinator
          metadata = KittRequestMetadata(
              request_id="composition", conversation_id="composition", turn_id="composition",
              route="agent-loop", agent_role=AgentRole.IMPLEMENT,
              parent_request_id="parent", task_id="task",
          )
          assert metadata.to_mapping()["task_id"] == "task"
          facts = HostExecutionState("composition", "composition", 0, 0, 0, False, False, True)
          assert facts.to_mapping()["completion_ready"] is True
          assert TaskPlanCoordinator.MAX_TASKS == 12
          print("Host planning contract composition: ok")
          PY
      - name: Verify composed namespace
        run: >-
          python -c "import kitt; import kitt.core.runtime; import kitt.daemon.client; import kitt.remote.server; import kitt.evolution; import kitt.evals.corpus; assert hasattr(kitt, 'DAEMON_PROTOCOL_VERSION'); print('composed namespace: ok', kitt.__file__)"

  reverse_proxy:
    needs: resolve_refs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rfdetoni/kitt-reverse-proxy
          ref: ${{ needs.resolve_refs.outputs.reverse_proxy_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run verify

  main_install:
    name: Install main ecosystem end to end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KITT_INSTALL_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.90.0"
      - name: Set installer Rust toolchain default
        run: rustup default 1.90.0
      - name: Install Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Validate main-first catalog before installation
        run: |
          python scripts/validate_ecosystem_main.py
          python scripts/validate_architecture.py
      - name: Perform clean main installation
        shell: bash
        run: |
          set -euo pipefail
          original_home="$HOME"
          export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
          export HOME="$RUNNER_TEMP/kitt-home"
          mkdir -p "$HOME"
          python -m installer \
            --preset agent \
            --yes \
            --root "$RUNNER_TEMP/kitt-runtime" \
            --bin-dir "$RUNNER_TEMP/kitt-bin" \
            --no-start-services \
            --verbose
      - name: Verify promoted runtime and exact provenance
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/kitt-runtime"
          bindir="$RUNNER_TEMP/kitt-bin"
          "$runtime/.venv-agent/bin/python" -m pip check
          "$bindir/kitt" --help >/dev/null
          "$bindir/kitt-reverse-proxy" --help >/dev/null

          # kittctl intentionally treats missing/unknown commands as usage
          # errors (exit 2) rather than exposing a GNU-style --help command.
          # Validate that the installed launcher executes and emits its expected
          # command surface without weakening the smoke test.
          set +e
          kittctl_usage="$("$bindir/kittctl" 2>&1)"
          kittctl_rc=$?
          set -e
          test "$kittctl_rc" -eq 2
          grep -q '^usage: kittctl ' <<<"$kittctl_usage"

          test ! -d "$runtime/.staging/sources"
          RUNTIME="$runtime" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNTIME"])
          installed = json.loads((root / "installed-state.json").read_text(encoding="utf-8"))
          assert installed["source_ref"] == "main", installed
          repositories = installed["repositories"]
          assert repositories, installed
          assert all(len(sha) == 40 for sha in repositories.values()), repositories
          expected = {
              "protocol", "memory", "toolbox", "assistant",
              "agent-cli", "ai-workers", "reverse-proxy",
          }
          assert set(installed["resolved_modules"]) == expected, installed["resolved_modules"]
          print("main end-to-end installation: ok")
          PY

  ecosystem:
    if: always()
    needs: [resolve_refs, installers, protocol, memory, toolbox, workers, assistant, agent_cli, reverse_proxy, main_install]
    runs-on: ubuntu-latest
    steps:
      - name: Require event-appropriate ecosystem gates
        shell: bash
        run: |
          set -euo pipefail

          # Every event validates the aggregate installers and a clean install
          # resolved from the current main branches end to end.
          test "${{ needs.installers.result }}" = success
          test "${{ needs.main_install.result }}" = success

          # A push to main is already composed from component commits that passed
          # their own repository gates. Avoid re-running every component suite
          # after promotion; PR/manual/scheduled runs remain the deep audit path.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "main push: main install gate passed; deep component audit intentionally skipped"
            exit 0
          fi

          test "${{ needs.resolve_refs.result }}" = success
          test "${{ needs.protocol.result }}" = success
          test "${{ needs.memory.result }}" = success
          test "${{ needs.toolbox.result }}" = success
          test "${{ needs.workers.result }}" = success
          test "${{ needs.assistant.result }}" = success
          test "${{ needs.agent_cli.result }}" = success
          test "${{ needs.reverse_proxy.result }}" = success
