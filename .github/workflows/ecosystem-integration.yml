name: ecosystem-integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash -n install.sh
      - shell: pwsh
        run: $null = [scriptblock]::Create((Get-Content -Raw ./install.ps1))

  main-install:
    name: Install main ecosystem end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KITT_INSTALL_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.90.0"
      - name: Set installer Rust toolchain default
        run: rustup default 1.90.0
      - name: Install Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Validate catalog and architecture
        run: |
          python scripts/validate_ecosystem_main.py
          python scripts/validate_architecture.py
      - name: Perform clean main installation
        shell: bash
        run: |
          set -euo pipefail
          original_home="$HOME"
          export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
          export HOME="$RUNNER_TEMP/kitt-home"
          mkdir -p "$HOME"
          python -m installer             --preset agent             --yes             --root "$RUNNER_TEMP/kitt-runtime"             --bin-dir "$RUNNER_TEMP/kitt-bin"             --no-start-services             --verbose
      - name: Resolve installed contract revisions
        id: contracts
        shell: bash
        run: |
          RUNTIME="$RUNNER_TEMP/kitt-runtime" python - <<'PYCONTRACTS'
          import json, os
          from pathlib import Path
          state = json.loads((Path(os.environ["RUNTIME"]) / "installed-state.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name in ("protocol", "reverse-proxy"):
                  sha = state["repositories"][f"rfdetoni/kitt-{name}"]
                  assert len(sha) == 40 and all(c in "0123456789abcdef" for c in sha)
                  output.write(f"{name}={sha}\n")
          PYCONTRACTS
      - name: Checkout installed Protocol contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rfdetoni/kitt-protocol
          ref: ${{ steps.contracts.outputs.protocol }}
          path: contract-protocol
          persist-credentials: false
      - name: Checkout installed Proxy contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rfdetoni/kitt-reverse-proxy
          ref: ${{ steps.contracts.outputs.reverse-proxy }}
          path: contract-proxy
          persist-credentials: false
      - name: Require matching gateway schemas
        run: python scripts/validate_gateway_schema.py --protocol contract-protocol --proxy contract-proxy
      - name: Verify installed runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/kitt-runtime"
          bindir="$RUNNER_TEMP/kitt-bin"
          "$runtime/.venv-agent/bin/python" -m pip check
          "$bindir/kitt" --help >/dev/null
          "$bindir/kitt-reverse-proxy" --help >/dev/null
          set +e
          kittctl_usage="$("$bindir/kittctl" 2>&1)"
          kittctl_rc=$?
          set -e
          test "$kittctl_rc" -eq 2
          grep -q '^usage: kittctl ' <<<"$kittctl_usage"
          test ! -d "$runtime/.staging/sources"
          RUNTIME="$runtime" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNTIME"])
          installed = json.loads((root / "installed-state.json").read_text(encoding="utf-8"))
          assert installed["source_ref"] == "main", installed
          assert installed["repositories"], installed
          assert all(len(sha) == 40 for sha in installed["repositories"].values())
          expected = {"protocol", "memory", "toolbox", "assistant", "agent-cli", "ai-workers", "reverse-proxy"}
          assert set(installed["resolved_modules"]) == expected, installed["resolved_modules"]
          print("main end-to-end installation: ok")
          PY
      - name: Perform release-channel smoke installation
        shell: bash
        run: |
          set -euo pipefail
          original_home="$HOME"
          export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
          export HOME="$RUNNER_TEMP/kitt-release-home"
          mkdir -p "$HOME"
          python -m installer \
            --modules agent-cli \
            --minimal \
            --channel release \
            --portable \
            --yes \
            --root "$RUNNER_TEMP/kitt-release-runtime" \
            --bin-dir "$RUNNER_TEMP/kitt-release-bin" \
            --no-start-services \
            --verbose
      - name: Verify immutable release revisions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kitt-release-runtime/.venv-agent/bin/python" -m pip check
          "$RUNNER_TEMP/kitt-release-bin/kitt" --help >/dev/null
          ROOT="$GITHUB_WORKSPACE" RUNTIME="$RUNNER_TEMP/kitt-release-runtime" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          runtime = Path(os.environ["RUNTIME"])
          manifest = json.loads((root / "ecosystem.release.json").read_text(encoding="utf-8"))
          installed = json.loads((runtime / "installed-state.json").read_text(encoding="utf-8"))

          selected = {"protocol", "memory", "agent-cli"}
          assert installed["source_channel"] == "release", installed
          assert installed["source_ref"] == "main", installed
          assert set(installed["resolved_modules"]) == selected, installed["resolved_modules"]

          expected_refs = {
              component_id: item["sha"]
              for component_id, item in manifest["components"].items()
          }
          assert installed["component_refs"] == expected_refs, installed["component_refs"]

          for component_id in selected:
              item = manifest["components"][component_id]
              actual = installed["repositories"][item["repository"]]
              assert actual == item["sha"], (component_id, actual, item["sha"])

          assert not (runtime / ".staging" / "sources").exists()
          print("release-channel immutable smoke: ok")
          PY


      - name: Perform release-channel Assistant lock smoke
        shell: bash
        run: |
          set -euo pipefail
          original_home="$HOME"
          export RUSTUP_HOME="${RUSTUP_HOME:-$original_home/.rustup}"
          export HOME="$RUNNER_TEMP/kitt-release-assistant-home"
          mkdir -p "$HOME"
          python -m installer \
            --modules assistant \
            --channel release \
            --yes \
            --root "$RUNNER_TEMP/kitt-release-assistant-runtime" \
            --bin-dir "$RUNNER_TEMP/kitt-release-assistant-bin" \
            --no-start-services \
            --verbose
          test -x "$RUNNER_TEMP/kitt-release-assistant-bin/kittctl"
          ROOT="$GITHUB_WORKSPACE" RUNTIME="$RUNNER_TEMP/kitt-release-assistant-runtime" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          runtime = Path(os.environ["RUNTIME"])
          manifest = json.loads((root / "ecosystem.release.json").read_text(encoding="utf-8"))
          installed = json.loads((runtime / "installed-state.json").read_text(encoding="utf-8"))

          selected = {"protocol", "memory", "assistant"}
          assert installed["source_channel"] == "release", installed
          assert set(installed["resolved_modules"]) == selected, installed["resolved_modules"]

          for component_id in selected:
              item = manifest["components"][component_id]
              actual = installed["repositories"][item["repository"]]
              assert actual == item["sha"], (component_id, actual, item["sha"])

          print("release-channel Assistant lock smoke: ok")
          PY

  ecosystem:
    if: always()
    needs: [installers, main-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require release gates
        shell: bash
        run: |
          test "${{ needs.installers.result }}" = success
          test "${{ needs.main-install.result }}" = success
