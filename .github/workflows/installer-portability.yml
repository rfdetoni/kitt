name: installer-portability

on:
  pull_request:
    paths:
      - ecosystem.json
      - install.sh
      - install.ps1
      - installer/**
      - tests/**
      - .github/workflows/installer-portability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-validation:
    name: Installer validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Static Python checks
        run: |
          python -m pip install ruff
          ruff check installer scripts --select F401,F841,F821,E9 --exclude "**/__init__.py"
      - name: Validate main-first ecosystem policy
        run: python scripts/validate_ecosystem_main.py
      - name: Run installer unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke real pinned REA npm installation for full preset
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from installer.rea_cli import install_rea, remove_rea_launcher
          base = Path(os.environ["RUNNER_TEMP"]) / "kitt-rea-smoke"
          root, bin_dir = base / "root", base / "bin"
          installed = install_rea(root, bin_dir)
          assert installed["installed"] and installed["version"] == "6.4.0"
          assert (bin_dir / "rea").is_symlink()
          twice = install_rea(root, bin_dir)
          assert twice["installed"]
          remove_rea_launcher(root, bin_dir)
          assert not (bin_dir / "rea").exists()
          print("pinned REA installed, version verified, and launcher ownership safe")
          PY
      - name: Validate complete Agent dependency closure
        run: python -m installer --modules agent-cli --dry-run --portable
      - name: List public installer surface
        run: python -m installer --list
      - name: Validate POSIX bootstrap syntax
        run: sh -n install.sh
      - name: Validate PowerShell bootstrap syntax
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$Tokens, [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  platform-lifecycle:
    if: github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os }} lifecycle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Run native lifecycle regressions
        run: python -m unittest tests.test_installer_portability -v
      - name: Validate native prerequisite discovery
        run: python -m installer --modules agent-cli --dry-run --portable
      - name: Validate POSIX bootstrap syntax
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n install.sh
      - name: Validate PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$Tokens, [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
