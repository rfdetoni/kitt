name: fix-ecosystem-windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ecosystem-windows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make composed namespace check cross-platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ecosystem-integration.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = '      - name: Verify composed namespace'
          starts = [i for i, line in enumerate(lines) if line == marker]
          if len(starts) != 1:
              raise SystemExit(f'expected one namespace step, found {len(starts)}')
          start = starts[0]
          end = start + 1
          while end < len(lines) and not (lines[end].startswith('      - name: ') and end > start):
              end += 1
          replacement = [
              marker,
              '        run: >-',
              '          python -c "import kitt.core.runtime; import kitt.daemon.client; import kitt.remote.server; import kitt.evolution; import kitt.evals.corpus; print(\'frozen composed namespace: ok\')"',
          ]
          path.write_text('\n'.join(lines[:start] + replacement + lines[end:]) + '\n', encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/ecosystem-integration.yml
          git config user.name 'KITT Migration Bot'
          git config user.email '85571449+rfdetoni@users.noreply.github.com'
          git add .github/workflows/ecosystem-integration.yml
          git commit -m 'ci(ecosystem): make namespace check cross-platform'
          git push origin HEAD:main
