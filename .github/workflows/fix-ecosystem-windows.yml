name: fix-ecosystem-windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ecosystem-windows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make composed namespace check cross-platform
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path(".github/workflows/ecosystem-integration.yml"); s=p.read_text(); old="      - name: Verify composed namespace\n        run: |\n          python - <<'"'"'PY'"'"'\n          import kitt.core.runtime\n          import kitt.daemon.client\n          import kitt.remote.server\n          import kitt.evolution\n          import kitt.evals.corpus\n          print('"'"'frozen composed namespace: ok'"'"')\n          PY\n"; new="      - name: Verify composed namespace\n        run: >-\n          python -c \\"import kitt.core.runtime; import kitt.daemon.client; import kitt.remote.server; import kitt.evolution; import kitt.evals.corpus; print('"'"'frozen composed namespace: ok'"'"')\\"\n"; assert old in s, "expected block not found"; p.write_text(s.replace(old,new,1))'
          git diff --check
          git config user.name 'KITT Migration Bot'
          git config user.email '85571449+rfdetoni@users.noreply.github.com'
          git add .github/workflows/ecosystem-integration.yml
          git commit -m 'ci(ecosystem): make namespace check cross-platform'
          git push origin HEAD:main
