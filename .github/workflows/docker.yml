name: Docker Compose

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - .env.docker.example
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - compose.yaml
      - .env.docker.example
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KITT_PROXY_API_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose --profile agent config --quiet
      - name: Build composed services
        run: docker compose --profile agent build browser reverse-proxy agent
