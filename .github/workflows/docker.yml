name: Docker Compose

on:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - .env.docker.example
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - compose.yaml
      - .env.docker.example
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        env:
          KITT_PROXY_API_KEY: ci-only-not-a-secret
        run: docker compose --profile agent config --quiet
